[project]
name = "cloud-arch-reviewer"
version = "0.1.0"
description = "AI reviewer for AWS architecture diagrams. Upload a diagram and get a Well-Architected scorecard, risks and fixes, powered by OpenAI vision and a Gradio UI."
readme = "README.md"
authors = [
    { name = "sivahere4cloud", email = "sivaganeshcloud@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.29.1",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
cloud-arch-reviewer = "cloud_arch_reviewer:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
